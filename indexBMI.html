<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styleA.css" />
    <link rel="stylesheet" href="styleB.css">
</head>
<body>
    <header>
    <div class="logo">
      <h1><span>IDEAL</span> LIFE</h1>
      <p class="tagline">Nourish Your Body, Empower Your Life</p>
    </div>
    <nav>
      <ul>
        <li><a href="indexHome.html">Home</a></li>
        <li><a href="indexTrackrecord.html">My Records</a></li>
        <li><a href="indexAboutUs.html">About Us</a></li>
        <li><a href="indexLogIn.html" class="btn-login">Log in</a></li>
        <li><a href="indexSignUp.html" class="btn-signup">Sign Up</a></li>
      </ul>
    </nav>
  </header>
  <div class="bmi-container">
  <div class="bmi-container">
  <div class="bmi-left">
    <h2 class="page-title" id="title">BMI CALCULATOR</h2>
    <p class="page-title">Enter the right value and click “calculate” to get the result</p>
    
    <label>Gender</label>
    <div class="gender-buttons">
      <button class="gender-btn" id="maleBtn">♂ Male</button>
      <button class="gender-btn" id="femaleBtn">♀ Female</button>
    </div>

    <label>Age</label>
    <input type="number" id="age" placeholder="Enter your age">

    <label>Height</label>
    <input type="number" id="height" placeholder="Enter height in cm">

    <label>Weight</label>
    <input type="number" id="weight" placeholder="Enter weight in kg">

    <button class="calculate-btn" onclick="calculateBMI()">CALCULATE</button>
  </div>

  <div class="bmi-right">
    <h3>Your results</h3>
    <label>BMI</label>
    <input type="text" id="bmi" readonly>
    
    <label>Category</label>

    <input type="text" id="bmi-category" readonly>

    <div class="bmi-scale">
        <div class="bmi-slot"><div id="cat-under" class="bmi-bar underweight">Underweight<br>< 18.5</div></div>
        <div class="bmi-slot"><div id="cat-normal" class="bmi-bar normal">Normal<br>18.5–24.9</div></div>
        <div class="bmi-slot"><div id="cat-over" class="bmi-bar overweight">Overweight<br>25–29.9</div></div>
        <div class="bmi-slot"><div id="cat-obese" class="bmi-bar obese">Obesity<br>30–39.9</div></div>
        <div class="bmi-slot"><div id="cat-extreme" class="bmi-bar extreme">Extreme<br>> 40</div></div>
    </div>

    
    <label>Healthy Weight for the height:</label>
    <input type="text" id="healthy-weight" readonly>

    <label>BMI Prime:</label>
    <input type="text" id="bmi-prime" readonly>

    <label>Ponderal Index:</label>
    <input type="text" id="ponderal" readonly>
  </div>
</div>

<script src="revisiBMI.js"></script>


</body>
</html>
